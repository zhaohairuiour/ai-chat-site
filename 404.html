<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 · AI Chat for Android</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#08080a" />
  <style>
    :root {
      --bg: #08080a;
      --panel: #101014;
      --line: #232329;
      --text: #ececef;
      --text-2: #b9b9c2;
      --muted: #8b8b96;
      --accent: #4d6bfe;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        linear-gradient(to right, rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.02) 1px, transparent 1px),
        var(--bg);
      background-size: 72px 72px, 72px 72px, auto;
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 560px;
      padding: 42px 38px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(16,16,20,.86);
      backdrop-filter: blur(12px);
      box-shadow: 0 30px 80px rgba(0,0,0,.6);
    }
    .code {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: .12em;
      color: var(--accent);
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 8vw, 52px);
      letter-spacing: -.04em;
      line-height: 1.05;
    }
    h1 span { color: var(--accent); }
    p {
      margin: 0 0 26px;
      color: var(--text-2);
      font-size: 15px;
      line-height: 1.75;
    }
    .term {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0b0b0f;
      padding: 14px 16px;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.8;
      color: var(--muted);
      margin-bottom: 26px;
    }
    .term b { color: var(--text); font-weight: 500; }
    .term i { color: var(--accent); font-style: normal; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 20px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 550;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .primary { background: var(--accent); color: #fff; }
    .primary:hover { background: #3f5cf0; transform: translateY(-1px); }
    .ghost { border: 1px solid var(--line); color: var(--text-2); }
    .ghost:hover { border-color: #3a3a45; color: var(--text); }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">HTTP 404 · PATH NOT FOUND</div>
    <h1>这条路径<br /><span>不在沙箱里</span></h1>
    <p>页面可能已经移动，或者链接本来就写错了。回首页，或者直接去看源码。</p>
    <div class="term">
      <div><b>$</b> find / -path "*想找的页面*"</div>
      <div><i>find:</i> no such file or directory</div>
      <div><b>$</b> cd / &amp;&amp; open index.html</div>
    </div>
    <div class="actions">
      <a class="primary" href="./">回到首页</a>
      <a class="ghost" href="https://github.com/zhaohairuiour/ai-chat-app" target="_blank" rel="noopener">查看源码</a>
    </div>
  </main>
</body>
</html>
